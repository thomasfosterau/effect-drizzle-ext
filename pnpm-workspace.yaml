# Every external version lives here; package.json files use `catalog:`,
# `catalog:peers` or `workspace:*`. `effect` must be a singleton (two copies
# break Context / Layer / Schema identity). Pins track the consuming
# applications' catalogs where they overlap.
packages:
  - packages/*
  - tests/*

catalogMode: strict

catalog:
  "@changesets/changelog-github": ^1.0.1
  "@changesets/cli": ^3.0.3
  "@effect/docgen": ^4.1.5
  "@effect/language-service": ^0.87.5
  # `effect-tsgo patch` supports only specific TypeScript / oxlint / tsrs
  # versions and fails `vp install` on others: move it with
  # `@typescript/native` and `vite-plus`, after checking the `components` table
  # in node_modules/@effect/tsgo/dist/effect-tsgo.cjs.
  "@effect/tsgo": 0.73.4
  "@effect/sql-pg": 4.1.5
  "@effect/vitest": 4.1.5
  "@effect/platform-node": 4.1.5
  "@testcontainers/postgresql": ^12.2.2
  # A dependency, not a peer: pure Schema helpers with no service identity.
  # Both 0.x lines export identical declarations for what core imports.
  "@thomasfosterau/effect-ext": ^0.4.0
  "@thomasfosterau/effect-jsonapi": ^0.22.2
  "@types/node": ^26.6.6
  # Must equal the vitest that vite-plus bundles (see `vitest` below).
  "@vitest/coverage-istanbul": 5.1.1
  # The first drizzle line with the Effect integration this library extends.
  drizzle-orm: 1.0.0-rc.5
  # Always the drizzle-orm pin.
  drizzle-kit: 1.0.0-rc.5
  "@enfect/oxlint": 0.10.0
  effect: 4.1.5
  fallow: 3.46.0
  # Only for `@effect/docgen`, which spawns it; scripts use `vpx`.
  tsx: ^4.23.15
  # TypeScript 6/7 side by side: `typescript` is the TS6 JS API (bin `tsc6`)
  # for JS-API consumers; `@typescript/native` is TS7 (bin `tsc`), which
  # type-checks and emits declarations. Exact: its build must match
  # @effect/tsgo's.
  typescript: "npm:@typescript/typescript6@6.0.2"
  "@typescript/native": "npm:typescript@7.0.2"
  # `vite`, `vitest` and `@vitest/coverage-istanbul` must equal what vite-plus
  # itself depends on (`npm view vite-plus@<v> dependencies`); `vite` no longer
  # equals vite-plus.
  vite-plus: 1.7.0
  vite: npm:@voidzero-dev/vite-plus-core@8.3.8000
  vitest: 5.1.1

# Peer ranges the published packages declare.
catalogs:
  peers:
    # `^4.0.0` unless a dependency requires more; name it here if so.
    "@effect/sql-pg": ^4.0.0
    "@effect/platform-node": ^4.0.0
    "@thomasfosterau/effect-jsonapi": ">=0.16.0"
    drizzle-kit: ">=1.0.0-rc.5"
    drizzle-orm: ">=1.0.0-rc.5"
    effect: ^4.0.0
    # Optional peer of the pg package's `./testing` Testcontainers fallback.
    "@testcontainers/postgresql": ">=12"

overrides:
  vite@*: "catalog:"
  vitest@*: "catalog:"
  effect: "catalog:"
nodeLinker: hoisted
allowBuilds:
  # Optional native accelerators from @testcontainers/postgresql; not needed.
  cpu-features: false
  esbuild: true
  fallow: true
  msgpackr-extract: true
  protobufjs: false
  ssh2: false
# Agent skills dependencies ship (pnpm 12.11+). `fallow` ships `fallow` and
# `fallow-setup`; only `fallow` is linked, since the repository is already set
# up. drizzle-kit's `drizzle` skill is linked too. Build grants stay in
# `allowBuilds`: a `permissions` entry without `build` leaves its package's
# `allowBuilds` grant in force.
permissions:
  fallow:
    skills: [fallow]
  drizzle-kit:
    skills: [drizzle]
skills:
  dirs: [.claude/skills]
# Hold new versions for 24 hours (minutes); Dependabot's cooldown is 1 day.
minimumReleaseAge: 1440
minimumReleaseAgeExclude:
  - "@thomasfosterau/*"
