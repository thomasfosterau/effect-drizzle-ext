# pnpm workspace — the two published packages plus the dist-consumer check.
#
# The `catalog:` protocol pins versions that MUST be singletons across the
# workspace. Effect especially: two copies of `effect` break Context / Layer /
# Schema identity at runtime, so every package references `catalog:`.
#
# EVERY external dependency version lives here — package.json files reference
# only `catalog:` / `catalog:peers` (or `workspace:*` for internal packages).
# `catalogMode: strict` makes `pnpm add` enforce this at add time and
# `pnpm install` reject non-catalog specifiers. After editing this catalog,
# ALWAYS run `pnpm install` and commit the regenerated pnpm-lock.yaml — a stale
# lockfile fails CI at once with ERR_PNPM_LOCKFILE_CONFIG_MISMATCH.
#
# Versions are kept in lockstep with the gardeneria application's catalog
# wherever the two overlap (effect, drizzle-orm, @effect/sql-pg, pg,
# vite-plus, the TypeScript 6/7 pair, fallow) — the apps consume this library,
# so the library builds against exactly what they run.
packages:
  - packages/*
  - tests/*

catalogMode: strict

catalog:
  "@changesets/changelog-github": ^1.0.1
  "@changesets/cli": ^3.0.3
  "@effect/language-service": ^0.87.2
  # Effect Language Service as a native (TypeScript-Go) binary — the TS7 side
  # of the 6/7 split. `effect-tsgo patch` overwrites the native `tsc` binary
  # with an Effect-patched build matched by gitHead, so this pins in lockstep
  # with `@typescript/native` below (0.41.0 ships against typescript 7.0.2) and
  # with the `oxlint` that `vite-plus` pulls in (0.3.0 carries oxlint 1.79.0).
  # Read the `components` table in node_modules/@effect/tsgo/dist/effect-tsgo.cjs
  # before bumping any of the three.
  "@effect/tsgo": 0.41.0
  "@effect/sql-pg": 4.0.0-rc.112
  "@mpsuesser/oxlint-plugin-effect": ^0.4.3
  # Starts the integration suite's ephemeral `pgvector/pgvector` server when no
  # local PostgreSQL is reachable — see packages/pg/tests/integration/global-setup.ts.
  "@testcontainers/postgresql": ^12.1.0
  # Optional peer of the core package: only the `./jsonapi*` subpaths import it.
  "@thomasfosterau/effect-jsonapi": ^0.14.0
  "@types/node": ^26.4.1
  "@types/pg": ^8.20.3
  "@vitest/coverage-istanbul": 4.1.11
  # A commit-suffixed prerelease: the first drizzle line to ship the Effect
  # integration (`drizzle-orm/effect-postgres`, `effect-core`, `effect-schema`)
  # this library extends. Same pin as the three applications.
  drizzle-orm: 1.0.0-rc.5-ab785fc
  effect: 4.0.0-rc.112
  effect-solutions: ^0.5.3
  fallow: 3.26.0
  # Matches @effect/sql-pg's own `pg` range.
  pg: ^8.20.0
  # TypeScript 6/7 side-by-side: TS7 (the native Go compiler) ships no JS API
  # until 7.1, so JS-API consumers (@effect/language-service) stay on TS6 while
  # native `tsc` type-checks AND emits this library's `dist/`. The alias keeps
  # the package importable as `typescript` name-stable at the TS6 JS compiler
  # (bin `tsc6`); `@typescript/native` is TS7 (bin `tsc`). Pinned exact:
  # @typescript/native's gitHead must match @effect/tsgo's bundled binary.
  typescript: "npm:@typescript/typescript6@6.0.2"
  "@typescript/native": "npm:typescript@7.0.2"
  # vite-plus pins `oxlint`, `oxfmt` and `vitest` to exact versions; `vite` is
  # the same release under its aliased core package, and `vitest` must match
  # vite-plus's exact pin because the `vitest: "catalog:"` override forces
  # every resolution to the catalog singleton.
  vite-plus: 0.3.0
  vite: npm:@voidzero-dev/vite-plus-core@0.3.0
  vitest: 4.1.11

# Peer ranges the PUBLISHED packages declare. Kept as a named catalog so the
# strict catalog mode still governs them while they stay ranges (an exact
# `4.0.0-rc.112` peer would reject a consumer on rc.115). `pnpm publish`
# replaces `catalog:peers` with these ranges in the published manifest.
catalogs:
  peers:
    "@effect/sql-pg": ">=4.0.0-rc.112"
    "@thomasfosterau/effect-jsonapi": ">=0.14.0"
    drizzle-orm: ">=1.0.0-rc.5"
    effect: ">=4.0.0-rc.112"
    pg: ">=8"

overrides:
  vite: "catalog:"
  vitest: "catalog:"
  # `effect` MUST be a singleton (see the header): force every resolution to
  # the catalog version so a hoisting reshuffle cannot introduce a second copy.
  effect: "catalog:"
nodeLinker: hoisted
allowBuilds:
  # cpu-features / ssh2 / protobufjs arrive via @testcontainers/postgresql;
  # their install scripts build optional native accelerators none of this
  # workspace needs, so they stay unbuilt.
  cpu-features: false
  esbuild: true
  fallow: true
  msgpackr-extract: true
  protobufjs: false
  ssh2: false
peerDependencyRules:
  allowAny:
    - vite
    - vitest
  allowedVersions:
    vite: "*"
    vitest: "*"

# Supply-chain delay (owner's policy, gardeneria #1149): hold newly published
# versions for 1 day (unit: MINUTES) before pnpm will install them.
minimumReleaseAge: 1440
minimumReleaseAgeExclude:
  # @thomasfosterau/* is first-party — exempt so our own releases install immediately.
  - "@thomasfosterau/*"
