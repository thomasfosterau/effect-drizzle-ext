# pnpm workspace — the two published packages plus the dist-consumer check.
#
# The `catalog:` protocol pins versions that MUST be singletons across the
# workspace. Effect especially: two copies of `effect` break Context / Layer /
# Schema identity at runtime, so every package references `catalog:`.
#
# EVERY external dependency version lives here — package.json files reference
# only `catalog:` / `catalog:peers` (or `workspace:*` for internal packages).
# `catalogMode: strict` makes `pnpm add` enforce this at add time and
# `pnpm install` reject non-catalog specifiers. After editing this catalog,
# ALWAYS run `pnpm install` and commit the regenerated pnpm-lock.yaml — a stale
# lockfile fails CI at once with ERR_PNPM_LOCKFILE_CONFIG_MISMATCH.
#
# Versions are kept in lockstep with the consuming applications' catalogs
# wherever they overlap (effect, drizzle-orm, @effect/sql-pg, vite-plus, the
# TypeScript 6/7 pair, @effect/tsgo, the Effect oxlint plugin) — the apps
# consume this library, so the library builds against exactly what they run.
# The pin set follows the freshest of the three, preferenceflow, except that
# the owner's 2026-10 tooling standard moved vite-plus (and with it vitest and
# @effect/tsgo) to the latest release ahead of the apps.
packages:
  - packages/*
  - tests/*

catalogMode: strict

catalog:
  "@changesets/changelog-github": ^1.0.1
  "@changesets/cli": ^3.0.3
  # Compiles AND RUNS every JSDoc `@example` (the `docgen` task); needs `tsx`
  # and a TypeScript JS API — the TS6 alias below satisfies its peer.
  "@effect/docgen": ^4.1.2
  "@effect/language-service": ^0.87.5
  # Effect Language Service as a native (TypeScript-Go) binary — the TS7 side
  # of the 6/7 split. `effect-tsgo patch` overwrites the native `tsc` binary
  # with an Effect-patched build matched by gitHead, so this pins in lockstep
  # with `@typescript/native` below and with the `oxlint` that `vite-plus`
  # pulls in: 0.63.0 supports typescript 7.0.2 / 7.1.0-beta /
  # 7.1.0-dev.20261028.1, oxlint 1.88.0 – 1.90.0 and oxlint-tsgolint
  # 7.0.2004 / 7.0.2005, and hard-errors
  # (UnsupportedTargetPackageVersionError) on anything else — failing
  # `pnpm install` itself. Read the `components` table in
  # node_modules/@effect/tsgo/dist/effect-tsgo.cjs before bumping any of the
  # three.
  "@effect/tsgo": 0.67.4
  "@effect/sql-pg": 4.1.2
  # The Node `FileSystem` / `Path` / `ChildProcessSpawner` layer the pg
  # package's tests provide to `./migrations`, `./testing`'s provisioning and
  # `./tooling` — a consumer provides its own (these modules only require the
  # services).
  "@effect/platform-node": 4.1.2
  # Starts the integration suite's ephemeral `pgvector/pgvector` server when no
  # local PostgreSQL is reachable — see packages/pg/tests/integration/global-setup.ts.
  "@testcontainers/postgresql": ^12.2.1
  # A dependency (not a peer) of the core package: the pure Schema helpers
  # (`./Ast`, `./LiteralExact`) carry no service identity a consumer must
  # share, and its one required peer, `effect ^4.0.0`, is already core's peer
  # at the same range (effect-drizzle-ext#135).
  "@thomasfosterau/effect-ext": ^0.1.0
  # Optional peer of the core package: only the `./jsonapi*` subpaths import it.
  "@thomasfosterau/effect-jsonapi": ^0.20.1
  "@types/node": ^26.6.6
  # Must equal the vitest that vite-plus bundles (see `vitest` below).
  "@vitest/coverage-istanbul": 5.1.0
  # The published `rc` build: the first drizzle line to ship the Effect
  # integration (`drizzle-orm/effect-postgres`, `effect-core`, `effect-schema`)
  # this library extends. Same pin as the three applications. Its
  # `TableConfig.isAlias` and single-`ViewConfig` `PgViewWithSelection` are what
  # the emitted `versioned-chain` declarations name (effect-drizzle-ext#95); the
  # earlier `1.0.0-rc.5-ab785fc` commit build has the older shapes.
  drizzle-orm: 1.0.0-rc.5
  # The optional peer `@thomasfosterau/effect-drizzle-ext-pg/tooling` diffs
  # schemas with (`drizzle-kit/api-postgres`); always the drizzle-orm pin.
  drizzle-kit: 1.0.0-rc.5
  # The Effect lint preset (`effect/*` rules, anti-slop included) that
  # vite.config.ts extends with `configs.recommended`; it runs inside the
  # oxlint vite-plus carries, but takes `@oxlint/plugins` as a caret range, so
  # Dependabot proposes it on its own, outside the `toolchain` group. It depends
  # on `effect` 4.1.0 exactly, but the `effect: "catalog:"` override below
  # resolves it to this workspace's singleton, which it lints fine against.
  "@enfect/oxlint": 0.9.0
  effect: 4.1.2
  fallow: 3.42.0
  # Exists only for `@effect/docgen`, which requires it as a peer and spawns
  # the `tsx` binary itself to run the compiled examples. Scripts run
  # TypeScript with `vpx`, never `tsx`.
  tsx: ^4.23.15
  # TypeScript 6/7 side-by-side: TS7 (the native Go compiler) ships no JS API
  # until 7.1, so JS-API consumers (@effect/language-service) stay on TS6 while
  # native `tsc` type-checks this library and emits the declarations `vp pack`
  # bundles into `dist/` (vite.package.ts's `packageBuild`). The alias keeps
  # the package importable as `typescript` name-stable at the TS6 JS compiler
  # (bin `tsc6`); `@typescript/native` is TS7 (bin `tsc`). Pinned exact:
  # @typescript/native's gitHead must match @effect/tsgo's bundled binary.
  typescript: "npm:@typescript/typescript6@6.0.2"
  "@typescript/native": "npm:typescript@7.0.2"
  # vite-plus pins `oxlint`, `oxfmt` and `vitest` to exact versions, so this
  # entry decides the oxlint `effect-tsgo patch --oxlint` has to support (see
  # the @effect/tsgo note above): 1.4.0 carries oxlint 1.89.0, oxfmt 0.74.0,
  # oxlint-tsgolint 7.0.2004 and vitest 5.0.5. `vite` is the same release
  # under its aliased core package, and `vitest` must match vite-plus's exact pin because the
  # `vitest: "catalog:"` override forces every resolution to the catalog
  # singleton; `@vitest/coverage-istanbul` above must equal it too, or
  # vite-plus refuses to run coverage. 1.x moved a task's `env` / `input` /
  # `output` under `cache: { … }` (see the package vite.config.ts files).
  vite-plus: 1.5.0
  vite: npm:@voidzero-dev/vite-plus-core@1.4.0
  vitest: 5.1.0

# Peer ranges the PUBLISHED packages declare. Kept as a named catalog so the
# strict catalog mode still governs them while they stay ranges. `pnpm pack` replaces `catalog:peers` with these ranges in the
# published manifest (see scripts/release.sh).
catalogs:
  peers:
    # The `effect` and `@effect/sql-pg` peers are `^4.0.0` (owner policy):
    # raise one only when a dependency requires a newer release, naming that
    # dependency and its range here. None does: drizzle-orm 1.0.0-rc.5 peers
    # on `effect` / `@effect/sql-pg` `>=4.0.0`, and @effect/sql-pg 4.0.0 on
    # `effect ^4.0.0`.
    "@effect/sql-pg": ^4.0.0
    "@thomasfosterau/effect-jsonapi": ">=0.16.0"
    drizzle-kit: ">=1.0.0-rc.5"
    drizzle-orm: ">=1.0.0-rc.5"
    effect: ^4.0.0
    # Optional peer of the pg package's `./testing` Testcontainers fallback.
    "@testcontainers/postgresql": ">=12"

overrides:
  # undici <8.12.2 — GHSA-xjj6-f33q-929c (high): an unhandled error on a
  # response with excessive content-encodings is a denial of service
  # (#96). Reached transitively (@effect/platform-node > undici), whose
  # range admits the fix but whose lockfile resolution stayed below it.
  # Drop once that resolution reaches >=8.12.2 on its own.
  undici: ^8.12.2
  # vite-plus's managed overrides (`vp migrate` writes the `@*` keys under
  # pnpm): every `vite` / `vitest` resolution is the catalog singleton.
  vite@*: "catalog:"
  vitest@*: "catalog:"
  # `effect` MUST be a singleton (see the header): force every resolution to
  # the catalog version so a hoisting reshuffle cannot introduce a second copy.
  effect: "catalog:"
  # GHSA-m9gg-hp2v-232j: @grpc/grpc-js <1.14.5 (via @testcontainers) fails `pnpm audit`.
  "@grpc/grpc-js@>=1.14.0 <1.14.5": ^1.14.5
  # launch-editor <=2.14.1 (via @changesets/cli) fails `pnpm audit --audit-level
  # high` (fs.existsSync check bypassable on Windows); 2.14.2 is patched.
  # Remove once @changesets/cli resolves a patched version on its own.
  "launch-editor@<=2.14.1": ^2.14.2
nodeLinker: hoisted
allowBuilds:
  # cpu-features / ssh2 / protobufjs arrive via @testcontainers/postgresql;
  # their install scripts build optional native accelerators none of this
  # workspace needs, so they stay unbuilt.
  cpu-features: false
  esbuild: true
  fallow: true
  msgpackr-extract: true
  protobufjs: false
  ssh2: false
peerDependencyRules:
  allowAny:
    - vite
    - vitest
  allowedVersions:
    vite: "*"
    vitest: "*"

# Supply-chain delay (owner's policy, gardeneria #1149; relaxed to 8 hours on
# 2026-10-30): hold newly published versions for 8 hours (unit: MINUTES) before
# pnpm will install them. Dependabot's `cooldown` (whole days only) is 1 day,
# longer than this, so it never proposes a version pnpm would still refuse.
minimumReleaseAge: 480
minimumReleaseAgeExclude:
  # @thomasfosterau/* is first-party — exempt so our own releases install immediately.
  - "@thomasfosterau/*"
