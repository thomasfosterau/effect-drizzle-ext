name: Release

# Changesets release flow, split so that only publishing waits for approval.
# On every push to `trunk`:
#
# - `select` (read-only) asks changesets/action/select-mode what the repo state
#   calls for: `version` while unreleased changesets exist, `publish` once none
#   remain and some package version is not on npm yet (`changeset
#   publish-plan`), else `none`.
# - `version` opens/updates the "chore: version packages" PR. It holds a
#   write-scoped token but no `id-token`, so it cannot publish, and runs outside
#   the `release` environment, so it needs no approval.
# - `publish` is the only job in the protected `release` environment and the
#   only one with `id-token: write`: it publishes to npm via OIDC trusted
#   publishing and tags the release, after the owner approves it (once per
#   release). See PUBLISHING.md.
#
# changesets/action's README recommends its sub-actions over the combined
# action for trusted publishing, "to tighten publish permissions"; they need
# Changesets CLI v3. The version and publish sub-actions push through the
# GitHub API, so no checkout keeps git credentials.

on:
  push:
    branches: [trunk]

# No permissions by default; each job opts into exactly what it needs.
permissions: {}

jobs:
  # Same setup as `publish` (see the comments there), minus the build.
  select:
    name: Select mode
    if: github.repository == 'thomasfosterau/effect-drizzle-ext' && github.actor != 'dependabot[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    outputs:
      mode: ${{ steps.mode.outputs.mode }}
    env: &id001
      pnpm_config_verify_deps_before_run: "false"
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Setup Vite+
        uses: voidzero-dev/setup-vp@v1.22.0
        with:
          cache: true
          run-install: false
      - name: Install dependencies
        run: pnpm install --frozen-lockfile --ignore-scripts
      - name: Select mode
        id: mode
        uses: changesets/action/select-mode@ae32849d5ba541f9ae29e40e22a623bc13562f51 # v2.1.2

  version:
    name: Version packages
    needs: select
    if: needs.select.outputs.mode == 'version'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    concurrency:
      group: release-version-${{ github.ref }}
      cancel-in-progress: true
    permissions:
      contents: write
      pull-requests: write
    env: *id001
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Setup Vite+
        uses: voidzero-dev/setup-vp@v1.22.0
        with:
          cache: true
          run-install: false
      - name: Install dependencies
        run: pnpm install --frozen-lockfile --ignore-scripts
      - name: Create or update the version PR
        uses: changesets/action/version@ae32849d5ba541f9ae29e40e22a623bc13562f51 # v2.1.2
        with:
          script: pnpm run version
          commit-message: "chore: version packages"
          pr-title: "chore: version packages"

  publish:
    name: Publish to npm
    # Never run on forks (they have neither the environment nor the trusted
    # publisher binding, so a fork cannot publish on your behalf), and never as
    # Dependabot: this job holds `id-token: write`. (It only runs on pushes to
    # `trunk`, which Dependabot never makes; the guard keeps that true.)
    # That guard is on `select` now: this job needs it, so it is skipped with it.
    needs: select
    if: needs.select.outputs.mode == 'publish'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # One publish at a time; never cancel one that has started.
    concurrency:
      group: release-publish-${{ github.ref }}
      cancel-in-progress: false
    # A protected GitHub Environment: required reviewers and a `trunk`-only
    # deployment rule pause every run for manual approval, and the npm
    # trusted-publisher bindings accept only tokens minted inside it.
    environment: release
    permissions:
      contents: write # push the release tags and create the GitHub releases
      id-token: write # OIDC: prove this workflow's identity to npm (no token needed)
    env:
      # pnpm 11 defaults `verify-deps-before-run` to `install`: before any
      # `pnpm run` / `pnpm exec` it compares node_modules with the manifests
      # and, if a manifest looks newer than the last install, re-installs
      # WITH lifecycle scripts, ignoring the `--ignore-scripts` of the install
      # step below — inside this job, which holds `id-token: write`. It
      # triggers whenever a manifest's mtime moves after the install step, e.g.
      # when the Changesets action checks out `changeset-release/trunk` and
      # `git reset --hard`s it before `pnpm run version`. Scoped to this job.
      # pnpm 11 reads only the `pnpm_config_*` spelling. Copied from effect-web.
      pnpm_config_verify_deps_before_run: "false"
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0

      # Not CI's install step: that one runs WITH scripts (the root `prepare`
      # patches tsc for CI's type gate). Here
      # --ignore-scripts keeps a compromised dependency's install hooks out of
      # this privileged job (the Shai-Hulud vector). The build needs no patch:
      # `vp pack` builds the same `dist/` with the unpatched native compiler
      # (the Effect plugin only adds diagnostics). It only holds because
      # `pnpm_config_verify_deps_before_run` is off for this job (see `env`).
      # An exact Node, never a range, for the job that publishes: 26.13.0
      # (LTS) ships npm 11.20.0, past the 11.5.1 that scripts/release.sh
      # requires for the OIDC trusted-publishing exchange (it checks and fails
      # loudly).
      - name: Setup Vite+
        uses: voidzero-dev/setup-vp@v1.22.0
        with:
          cache: true
          run-install: false
          node-version: "26.13.0"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile --ignore-scripts

      # `pnpm exec`, not a GITHUB_PATH entry (zizmor's `github-env`).
      - name: Build
        run: pnpm exec vp run -r build

      # Once the version PR has merged (no changesets remain), this runs `pnpm
      # run release` — scripts/release.sh: `pnpm pack` per package (which
      # resolves the `catalog:` / `workspace:` specifiers) then `npm publish
      # <tarball>` per package under OIDC, then `changeset tag`. The action
      # parses the "New tag:" output, pushes the tags and creates the GitHub
      # releases.
      #
      # v2 of the action pairs with Changesets CLI v3 (`@changesets/cli` in
      # the catalog) and renamed v1's `version` / `publish` / `commit` /
      # `title` inputs. SHA-pinned: this step runs with `id-token: write`.
      - name: Publish to npm
        uses: changesets/action/publish@ae32849d5ba541f9ae29e40e22a623bc13562f51 # v2.1.2
        with:
          script: pnpm run release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
