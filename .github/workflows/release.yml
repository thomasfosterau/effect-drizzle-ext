name: Release

# Changesets release flow: on every push to `trunk`, changesets/action either
# opens/updates the "Version Packages" PR (when unreleased changesets exist)
# or, when that PR has merged and no changesets remain, publishes both
# packages to npm and tags the release.
#
# Publishing is npm OIDC trusted publishing — there is NO `NPM_TOKEN`. The
# workflow proves its identity to npm with a short-lived, job-scoped OIDC
# token, and each package's trusted-publisher binding on npmjs.com names this
# repository, this workflow file and the `release` environment. Provenance is
# left to npm (attached automatically where supported; never forced, which fails
# from a private repository). The owner's one-time setup (the protected `release`
# environment, the two trusted-publisher bindings, the Actions permission to
# open PRs) is in PUBLISHING.md; the shape is copied from effect-jsonapi.

on:
  push:
    branches: [trunk]

concurrency:
  group: release-${{ github.ref }}

# No permissions by default; the release job opts into exactly what it needs.
permissions: {}

jobs:
  release:
    name: Version or publish
    # Never run on forks (they have neither the environment nor the trusted
    # publisher binding, so a fork cannot publish on your behalf).
    if: github.repository == 'thomasfosterau/effect-drizzle-ext'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # A protected GitHub Environment: required reviewers and a `trunk`-only
    # deployment rule pause every run for manual approval, and the npm
    # trusted-publisher bindings accept only tokens minted inside it.
    environment: release
    permissions:
      contents: write # push the version commit/tag and the "Version Packages" PR branch
      pull-requests: write # open/update the "Version Packages" PR
      id-token: write # OIDC: prove this workflow's identity to npm (no token needed)
    env:
      # pnpm 11 defaults `verify-deps-before-run` to `install`: before any
      # `pnpm run` / `pnpm exec` it compares node_modules with the manifests
      # and, if a manifest looks newer than the last install, re-installs
      # WITH lifecycle scripts, ignoring the `--ignore-scripts` of the install
      # step below — inside this job, which holds `id-token: write`. It
      # triggers whenever a manifest's mtime moves after the install step, e.g.
      # when the Changesets action checks out `changeset-release/trunk` and
      # `git reset --hard`s it before `pnpm run version`. Scoped to this job.
      # pnpm 11 reads only the `pnpm_config_*` spelling. Copied from effect-web.
      pnpm_config_verify_deps_before_run: "false"
    steps:
      - name: Checkout
        # The Changesets action pushes the version branch, so it needs the
        # checkout's git credentials (the ephemeral, job-scoped GITHUB_TOKEN).
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      # Not the shared ./.github/actions/setup: that one installs WITH
      # scripts (the root `prepare` patches tsc for CI's type gate). Here
      # --ignore-scripts keeps a compromised dependency's install hooks out of
      # this privileged job (the Shai-Hulud vector). The build needs no patch:
      # the unpatched native `tsc` emits the same `dist/` (the Effect plugin
      # only adds diagnostics). It only holds because
      # `pnpm_config_verify_deps_before_run` is off for this job (see `env`).
      - name: Setup pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      # Node `latest` ships npm >= 11.5.1, which scripts/release.sh requires
      # for the OIDC trusted-publishing exchange (it checks and fails loudly).
      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: latest
          cache: pnpm

      - name: Install dependencies
        run: |
          pnpm install --frozen-lockfile --ignore-scripts
          echo "$PWD/node_modules/.bin" >> "$GITHUB_PATH"

      - name: Build
        run: vp run -r build

      # When changesets are pending, this opens/updates a "Version Packages" PR
      # (via `pnpm run version`). Once that PR is merged (no changesets remain),
      # it runs `pnpm run release` — scripts/release.sh: `pnpm pack` per package
      # (which resolves the `catalog:` / `workspace:` specifiers) then
      # `npm publish <tarball>` per package under OIDC, then `changeset tag`.
      # The action parses the "New tag:" output, pushes the tags and creates
      # the GitHub releases.
      #
      # v2 of the action pairs with Changesets CLI v3 (`@changesets/cli` in
      # the catalog) and renamed v1's `version` / `publish` / `commit` /
      # `title` inputs. SHA-pinned: this step runs with `id-token: write`.
      - name: Create release PR or publish to npm
        uses: changesets/action@ae32849d5ba541f9ae29e40e22a623bc13562f51 # v2.1.2
        with:
          version-script: pnpm run version
          publish-script: pnpm run release
          commit-message: "chore: version packages"
          pr-title: "chore: version packages"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
