# Groups bundle sets that must move together (toolchain, effect, drizzle) and
# cut noise for the rest. `vite`, `vitest` and `@vitest/*` are ignored: their
# versions are whatever vite-plus depends on, re-pinned by `vp migrate` in the
# toolchain update (see docs/CONTRIBUTING.md).
version: 2
updates:
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "daily"
    open-pull-requests-limit: 10
    assignees: [thomasfosterau]
    labels: [dependencies]
    commit-message:
      prefix: "chore"
    cooldown:
      default-days: 1
      exclude:
        - "@thomasfosterau/*"
    ignore:
      - dependency-name: "vite"
      - dependency-name: "vitest"
      - dependency-name: "@vitest/*"
    groups:
      toolchain:
        applies-to: version-updates
        patterns:
          - "vite-plus"
          - "@voidzero-dev/*"
          - "@effect/tsgo"
      effect:
        applies-to: version-updates
        patterns:
          - "effect"
          - "@effect/*"
        exclude-patterns:
          - "@effect/tsgo"
      drizzle:
        applies-to: version-updates
        patterns:
          - "drizzle-orm"
          - "drizzle-kit"
      own-packages:
        applies-to: version-updates
        patterns:
          - "@thomasfosterau/*"
      dev-tools:
        applies-to: version-updates
        patterns:
          - "@changesets/*"
          - "@enfect/oxlint"
          - "@testcontainers/*"
          - "@types/node"
          - "fallow"
          - "tsx"
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    assignees: [thomasfosterau]
    labels: [dependencies]
    commit-message:
      prefix: "chore"
    cooldown:
      default-days: 1
    groups:
      actions:
        patterns: ["*"]
  - package-ecosystem: "devcontainers"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    assignees: [thomasfosterau]
    labels: [dependencies]
    commit-message:
      prefix: "chore"
    cooldown:
      default-days: 1
    groups:
      devcontainers:
        patterns: ["*"]
