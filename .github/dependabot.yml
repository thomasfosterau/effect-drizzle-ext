# Groups cover only sets that must move together. By-hand steps for the
# toolchain group are in docs/CONTRIBUTING.md.
version: 2
updates:
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "daily"
    open-pull-requests-limit: 10
    assignees: [thomasfosterau]
    labels: [dependencies]
    commit-message:
      prefix: "chore"
    cooldown:
      default-days: 1
      exclude:
        - "@thomasfosterau/*"
    groups:
      toolchain:
        applies-to: version-updates
        patterns:
          - "vite-plus"
          - "@voidzero-dev/*"
          - "vitest"
          - "@vitest/*"
          - "@effect/tsgo"
      effect:
        applies-to: version-updates
        patterns:
          - "effect"
          - "@effect/*"
        exclude-patterns:
          - "@effect/tsgo"
      drizzle:
        applies-to: version-updates
        patterns:
          - "drizzle-orm"
          - "drizzle-kit"
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "daily"
    open-pull-requests-limit: 5
    assignees: [thomasfosterau]
    labels: [dependencies]
    commit-message:
      prefix: "chore"
    cooldown:
      default-days: 1
  - package-ecosystem: "devcontainers"
    directory: "/"
    schedule:
      interval: "daily"
    open-pull-requests-limit: 5
    assignees: [thomasfosterau]
    labels: [dependencies]
    commit-message:
      prefix: "chore"
    cooldown:
      default-days: 1
