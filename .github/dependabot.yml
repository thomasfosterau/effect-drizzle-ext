# Dependabot version updates. The `npm` ecosystem at `/` reads the pnpm
# workspace, its catalogs and pnpm-lock.yaml.
#
# Dependabot puts a dependency in the FIRST group whose patterns match, so the
# groups run specific → general, and each lockstep set is a group that takes
# every update type (major included) so its members can never move apart:
#
# - `toolchain`: `effect-tsgo patch` matches the native `tsc` (@typescript/native)
#   and the `oxlint` / `oxlint-tsgolint` that vite-plus carries by gitHead and
#   hard-errors on a pairing it has no artifact for, failing `pnpm install`;
#   vite-plus pins its own oxlint, oxfmt and vitest exactly, the `vite` /
#   `vitest` catalog entries and `@vitest/coverage-istanbul` must equal those
#   pins, and the Effect lint plugin runs inside that oxlint. A group PR can
#   still go red when no @effect/tsgo release supports the new oxlint yet:
#   read the `components` table in node_modules/@effect/tsgo/dist/effect-tsgo.cjs
#   (pnpm-workspace.yaml's comments say how).
# - `effect`: the Effect 4 line is a lockstep-versioned singleton set
#   (`effect`, `@effect/sql-pg`, `@effect/platform-node`, the language
#   service); `@effect/tsgo` belongs to the toolchain set instead.
# - `drizzle`: drizzle-kit is always the drizzle-orm pin. Both are
#   commit-suffixed prereleases with no meaningful semver bump to compute, so
#   their *version* updates are ignored below and the group carries only
#   security updates; move them by hand, together.
# - `testcontainers`, `changesets`, `fallow`: sets released together.
# - `minor-and-patch`: every other minor / patch update in one PR, so PR
#   volume stays low; a major outside the sets above stays its own PR.
#
# Not bumpable by Dependabot: the `@grpc/grpc-js` security override in
# pnpm-workspace.yaml's `overrides` (a transitive pin of @testcontainers).
# Revisit it by hand whenever the `testcontainers` group moves (AGENTS.md →
# Commands).
#
# `cooldown` mirrors pnpm-workspace.yaml's `minimumReleaseAge` (1 day), with
# first-party `@thomasfosterau/*` exempt as `minimumReleaseAgeExclude` is.
#
# `docker-compose` watches the dev container's images (.devcontainer/compose.yaml).
# The workspace image's Node major tracks CI's `latest` and pgvector's `pg17`
# tracks CI's service container, so a PR that moves either major lands only
# together with the matching CI change.
version: 2
updates:
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 10
    labels:
      - "dependencies"
    commit-message:
      prefix: "chore"
    cooldown:
      default-days: 1
      exclude:
        - "@thomasfosterau/*"
    groups:
      toolchain:
        applies-to: version-updates
        patterns:
          - "vite-plus"
          - "vite"
          - "vitest"
          - "@vitest/*"
          - "oxlint"
          - "oxfmt"
          - "oxlint-tsgolint"
          - "@effect/tsgo"
          - "@typescript/native"
          - "typescript"
          - "@typescript/typescript6"
          - "@mpsuesser/oxlint-plugin-effect"
        update-types: ["major", "minor", "patch"]
      effect:
        applies-to: version-updates
        patterns:
          - "effect"
          - "@effect/*"
        exclude-patterns:
          - "@effect/tsgo"
        update-types: ["major", "minor", "patch"]
      drizzle:
        applies-to: version-updates
        patterns:
          - "drizzle-orm"
          - "drizzle-kit"
        update-types: ["major", "minor", "patch"]
      testcontainers:
        applies-to: version-updates
        patterns:
          - "pg"
          - "@types/pg"
          - "testcontainers"
          - "@testcontainers/*"
        update-types: ["major", "minor", "patch"]
      changesets:
        applies-to: version-updates
        patterns:
          - "@changesets/*"
        update-types: ["major", "minor", "patch"]
      fallow:
        applies-to: version-updates
        patterns:
          - "fallow"
        update-types: ["major", "minor", "patch"]
      minor-and-patch:
        applies-to: version-updates
        patterns:
          - "*"
        update-types: ["minor", "patch"]
    ignore:
      - dependency-name: "drizzle-orm"
        update-types:
          [
            "version-update:semver-major",
            "version-update:semver-minor",
            "version-update:semver-patch",
          ]
      - dependency-name: "drizzle-kit"
        update-types:
          [
            "version-update:semver-major",
            "version-update:semver-minor",
            "version-update:semver-patch",
          ]
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 5
    labels:
      - "dependencies"
    commit-message:
      prefix: "chore"
    groups:
      github-actions:
        patterns:
          - "*"
  - package-ecosystem: "docker-compose"
    directory: "/.devcontainer"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 5
    labels:
      - "dependencies"
    commit-message:
      prefix: "chore"
    cooldown:
      default-days: 1
