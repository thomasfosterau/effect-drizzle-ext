# Composite setup shared by every CI job: pnpm (version from packageManager),
# Node with the pnpm store cache, then a frozen install. Later steps call the
# project's own CLI as `pnpm exec vp …`: writing node_modules/.bin to
# GITHUB_PATH is zizmor's `github-env` finding (a later step's PATH would come
# from a file any earlier step can write). Copied from the gardeneria
# application.
#
# Callers must run `actions/checkout` BEFORE this (a local composite action
# needs the repo on disk first).
name: Setup toolchain
description: Set up Node.js and pnpm, restore the package cache, and install dependencies.
runs:
  using: composite
  steps:
    # pnpm before Node so setup-node's `cache: pnpm` can resolve the store path.
    # The pnpm version comes from the `packageManager` field in package.json.
    - name: Setup pnpm
      uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

    - name: Setup Node.js
      uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
      with:
        # The newest released Node: `"*"` + `check-latest`, never `latest`,
        # which setup-node resolves to the Node 27 alpha (it hangs some tests).
        node-version: "*"
        check-latest: true
        cache: pnpm

    # Retried up to three times: pnpm's linker has raced itself transiently on a
    # cold store (gardeneria CI, 2026-07-26), failing a run before any check ran.
    # Retrying is safe because `pnpm install` reconciles node_modules against the
    # committed lockfile on every attempt. `--frozen-lockfile`, install scripts
    # and the supply-chain policy check still run on every attempt, so a
    # deterministic failure (lockfile drift, a policy violation) still turns the
    # job red.
    - name: Install dependencies
      shell: bash
      run: |
        for attempt in 1 2 3; do
          if pnpm install --frozen-lockfile; then
            break
          fi
          if [ "$attempt" -eq 3 ]; then
            echo "::error::pnpm install failed after 3 attempts"
            exit 1
          fi
          delay=$((attempt * 15))
          echo "::warning::pnpm install failed (attempt ${attempt}/3); retrying in ${delay}s"
          sleep "$delay"
        done
